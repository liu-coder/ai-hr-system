server:
  port: 8888

spring:
  application:
    name: ai-hr-config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

# Eureka 客户端配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus