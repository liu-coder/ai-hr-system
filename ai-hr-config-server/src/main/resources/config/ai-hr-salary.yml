server:
  port: 9020

spring:
  datasource:
    url: jdbc:mysql://${AIHR_MYSQL_HOST:localhost}:${AIHR_MYSQL_PORT:3306}/ai_hr_salary?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${AIHR_MYSQL_USER:root}
    password: ${AIHR_MYSQL_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: ${AIHR_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aihr:
  security:
    jwt:
      issuer: ${AIHR_JWT_ISSUER:ai-hr-auth}
      secret: ${AIHR_JWT_SECRET:A9b@C8d!E7f%G6h*I5j?K4l&M3n@P2q!R1s%T0u@}

rocketmq:
  name-server: ${AIHR_ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: salary-producer-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.9,0.95,0.99
