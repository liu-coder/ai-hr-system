spring:
  datasource:
    url: jdbc:mysql://${AIHR_MYSQL_HOST:localhost}:${AIHR_MYSQL_PORT:3306}/ai_hr_attendance?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${AIHR_MYSQL_USER:root}
    password: ${AIHR_MYSQL_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

aihr:
  security:
    jwt:
      issuer: ${AIHR_JWT_ISSUER:ai-hr-auth}
      secret: ${AIHR_JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus