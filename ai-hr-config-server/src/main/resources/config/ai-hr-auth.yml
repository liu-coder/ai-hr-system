server:
  port: ${SERVER_PORT:9101}

spring:
  datasource:
    url: jdbc:mysql://${AIHR_MYSQL_HOST:localhost}:${AIHR_MYSQL_PORT:3306}/ai_hr_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${AIHR_MYSQL_USER:root}
    password: ${AIHR_MYSQL_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: ${AIHR_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aihr:
  security:
    jwt:
      issuer: ai-hr-auth
      secret: ${AIHR_JWT_SECRET:A9b@C8d!E7f%G6h*I5j?K4l&M3n@P2q!R1s%T0u@}
      access-token-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus