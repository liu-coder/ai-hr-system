spring:
  application:
    name: ai-hr-auth
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
      fail-fast: true
      retry:
        max-attempts: 3
        max-interval: 2000

# 注册到 Eureka，供网关 lb:// 与 ai-core 服务间调用解析实例
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${AIHR_EUREKA_URL:http://localhost:8761/eureka/}