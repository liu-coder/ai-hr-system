spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  redis:
    host: localhost
    port: 6379
  cloud:
    discovery:
      enabled: false

aihr:
  dashscope:
    api-key: test-key
  milvus:
    host: localhost
    port: 19530
    database: default
    collection: test_collection
