spring:
  application:
    name: ai-hr-ai-core
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  ai:
    dashscope:
      # 配置中心暂不可达时的兜底（与 config-server 中 ai-hr-ai-core.yml 默认一致）
      api-key: ${AIHR_DASHSCOPE_API_KEY:sk-b4457e61a0954553b3476f5222af224c}

# 配置中心晚于本服务启动时，Docker 注入的 AIHR_JWT_* 需映射到此，否则 ServiceJwtProps 校验失败导致进程退出
aihr:
  security:
    jwt:
      issuer: ${AIHR_JWT_ISSUER:ai-hr-auth}
      secret: ${AIHR_JWT_SECRET:A9b@C8d!E7f%G6h*I5j?K4l&M3n@P2q!R1s%T0u@}
  milvus:
    host: ${AIHR_MILVUS_HOST:localhost}
    port: ${AIHR_MILVUS_PORT:19530}
    database: ${AIHR_MILVUS_DATABASE:default}
    collection: ${AIHR_MILVUS_COLLECTION:ai_hr_policy_chunks}
  services:
    attendance-base-url: http://ai-hr-attendance
    salary-base-url: http://ai-hr-salary
  toolinvoker:
    max-attempts: 3
    timeout-ms: 5000
    initial-backoff-ms: 100

server:
  port: ${SERVER_PORT:9030}
