spring:
  application:
    name: ai-hr-ai-core
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 6
        max-interval: 3000

# 注册到 Eureka；并拉取注册表以使用 @LoadBalanced 调用 ai-hr-attendance 等
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${AIHR_EUREKA_URL:http://localhost:8761/eureka/}