spring:
  application:
    name: ai-hr-gateway
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        max-attempts: 3
        max-interval: 2000

# 启用服务发现，通过服务名查找配置服务器
eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/